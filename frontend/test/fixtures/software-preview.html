await init();
const app={id:'demo',app_id:42,name:'Moving Out',command:'"C:\\Games\\Moving Out\\MovingOut.exe"'};

const view=new AdminView(document.body,()=>{});
view._hostApps=[app];view._hostAppsSupported=true;document.querySelector('#apps').innerHTML=view._renderHostApps();view._bindHostApps();
